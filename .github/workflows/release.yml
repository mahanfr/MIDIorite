name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p package
          cp build/midiorite package/midiorite_linux_x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midiorite-linux-x86_64
          path: package/midiorite_linux_x86_64


  windows-mingw:
    name: Windows MinGW
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64

      - name: Configure
        run: |
          cmake -S . -B build \
            -DMINGW=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p package
          cp build/midiorite.exe package/midiorite_windows_x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midiorite-windows-x86_64
          path: package/midiorite_windows_x86_64.exe


  release:
    name: Publish Release
    runs-on: ubuntu-latest

    needs:
      - linux
      - windows-mingw

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: midiorite-linux-x86_64
          path: release

      - name: Download Windows MinGW artifact
        uses: actions/download-artifact@v5
        with:
          name: midiorite-windows-x86_64
          path: release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/midiorite_linux_x86_64
            release/midiorite_windows_x86_64.exe
